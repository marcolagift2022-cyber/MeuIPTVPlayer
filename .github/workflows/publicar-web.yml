name: Publicar Web Player

# Copia a pasta web/ para o ramo "gh-pages" (o GitHub Pages publica esse ramo como site).
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/publicar-web.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar no ramo gh-pages
        run: |
          cd web
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Web Player ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
