name: Publicar Web Player

# Copia a pasta web/ para o ramo "gh-pages" (o GitHub Pages publica esse ramo como site).
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/publicar-web.yml"]
  # Toda vez que sai um APK novo, o site é publicado de novo com ele (brutcine.ink/app.apk)
  workflow_run:
    workflows: ["Gerar APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir as bibliotecas de vídeo (CDN)
        run: |
          for u in $(grep -o 'https://cdn.jsdelivr.net/[^"]*' web/index.html); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$u"); echo "$code $u"; [ "$code" = "200" ]
          done
      - name: Colocar o APK mais novo no site
        run: |
          curl -fsSL -o web/app.apk "https://github.com/${{ github.repository }}/releases/latest/download/MeuIPTVPlayer.apk"
          ls -la web/app.apk
          [ "$(stat -c %s web/app.apk)" -gt 1000000 ]
      - name: Publicar no ramo gh-pages
        run: |
          cd web
          touch .nojekyll
          rm -f LEIA-ME-WEB.md  # o guia fica só no projeto, não no site
          # Endereço próprio do site (domínio da Namecheap)
          echo "brutcine.ink" > CNAME
          # Versão no endereço dos arquivos: o navegador sempre baixa a mais nova
          V=$(echo "${{ github.sha }}" | cut -c1-8)
          sed -i "s#css/style.css\"#css/style.css?v=$V\"#; s#js/app.js\"#js/app.js?v=$V\"#" index.html
          grep -n "?v=" index.html
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Web Player ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
