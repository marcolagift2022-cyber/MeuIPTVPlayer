name: Gerar APK

on:
  push:
    # Editar o config.json (DNS/aviso) ou textos NÃO gera um APK novo
    paths-ignore:
      - "config.json"
      - "**.md"
      - "tv/**"
      - "loja/**"
      - ".github/workflows/build-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk MeuIPTVPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeuIPTVPlayer-apk
          path: MeuIPTVPlayer.apk

      # Publica o APK num link fixo:
      # https://github.com/<usuario>/MeuIPTVPlayer/releases/latest/download/MeuIPTVPlayer.apk
      - name: Publicar APK para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" MeuIPTVPlayer.apk \
            --title "Meu IPTV Player $TAG" \
            --notes "APK para instalar no celular, TV Box ou emulador." \
            --latest
