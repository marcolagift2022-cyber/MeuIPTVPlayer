<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0F0B">
  <title>Baixar o app X BR TOP CINE</title>
  <link rel="icon" type="image/png" href="../img/logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background: #0A0F0B url("../img/bg.jpg") center / cover no-repeat fixed; color: #F2F4F7;
      font-family: "Segoe UI", Roboto, Arial, sans-serif; text-align: center;
    }
    .box { width: min(460px, 100%); background: rgba(10, 15, 11, .82); border-radius: 18px; padding: 26px 22px; }
    img { width: min(300px, 80%); height: auto; }
    h1 { font-size: 22px; margin: 8px 0 6px; }
    p { color: #A9B5AC; line-height: 1.5; }
    .btn {
      display: block; margin: 22px 0 18px; padding: 16px; border-radius: 12px; background: #1E7A35;
      color: #fff; font-size: 19px; font-weight: bold; text-decoration: none;
    }
    .btn:hover { background: #25943F; }
    ol { text-align: left; color: #DDE5DF; line-height: 1.6; padding-left: 22px; font-size: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="../img/logo.png" alt="X BR TOP CINE">
    <h1>App para Android</h1>
    <p>Celular, TV Box e Android TV.</p>
    <a class="btn" href="../app.apk" download="XBRTopCine.apk">Baixar o app</a>
    <ol>
      <li>Toque em <b>Baixar o app</b> e espere terminar.</li>
      <li>Toque em <b>Abrir</b> (ou abra o arquivo nos Downloads).</li>
      <li>Se o Android pedir, permita <b>instalar apps desconhecidos</b>.</li>
      <li>Toque em <b>Instalar</b> e entre com seu usuário e senha.</li>
    </ol>
  </div>
</body>
</html>
