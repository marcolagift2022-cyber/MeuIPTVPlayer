<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0F0B">
  <title>X BR TOP CINE</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css?v=b0a2a9b7">
</head>
<body>
  <div id="bg"></div>

  <!-- ===================== LOGIN ===================== -->
  <section id="screen-login" class="screen">
    <div class="login-box">
      <img class="login-logo" src="img/logo.png" alt="X BR TOP CINE">
      <p class="sub">Digite o usuário e a senha da sua assinatura.</p>
      <input id="in-user" class="focusable input" type="text" placeholder="Usuário" autocomplete="username" autocapitalize="off" spellcheck="false">
      <div class="pass-wrap">
        <input id="in-pass" class="focusable input" type="password" placeholder="Senha" autocomplete="current-password">
        <button id="btn-eye" class="eye" type="button" aria-label="Mostrar senha" tabindex="-1"></button>
      </div>
      <button id="btn-login" class="focusable btn primary">Entrar</button>
      <div id="login-loading" class="spinner hidden"></div>
      <p id="login-error" class="error"></p>
    </div>
  </section>

  <!-- ===================== MENU ===================== -->
  <section id="screen-home" class="screen hidden">
    <div class="home-left">
      <div id="clock" class="clock"></div>
      <div id="home-user" class="muted"></div>
      <div id="home-exp" class="exp"></div>
      <img class="home-logo" src="img/logo.png" alt="">
      <div class="toolbar">
        <button class="focusable tool" id="btn-search"><span class="ico ico-search"></span>Buscar</button>
        <button class="focusable tool" id="btn-refresh"><span class="ico ico-refresh"></span>Atualizar</button>
        <button class="focusable tool" id="btn-logout"><span class="ico ico-logout"></span>Sair</button>
      </div>
    </div>
    <div id="home-notice" class="notice hidden"></div>
    <div class="home-grid">
      <button class="focusable tile" id="tile-live" style="background-image:url('img/menu_live.jpg')"><span class="shade"></span><span class="label"><span class="ico big ico-live"></span>TV ao vivo</span></button>
      <button class="focusable tile" id="tile-movie" style="background-image:url('img/menu_movies.jpg')"><span class="shade"></span><span class="label"><span class="ico big ico-movie"></span>Filmes</span></button>
      <button class="focusable tile" id="tile-series" style="background-image:url('img/menu_series.jpg')"><span class="shade"></span><span class="label"><span class="ico big ico-series"></span>Séries</span></button>
      <button class="focusable tile" id="tile-fav" style="background-image:url('img/menu_favorites.jpg')"><span class="shade"></span><span class="label"><span class="ico big ico-star"></span>Favoritos</span></button>
    </div>
  </section>

  <!-- ===================== LISTA (categorias + grade) ===================== -->
  <section id="screen-list" class="screen hidden">
    <div class="list-header">
      <button class="focusable back" data-back="1" aria-label="Voltar"></button>
      <h1 id="list-title"></h1>
      <input id="list-search" class="focusable input small" type="search" placeholder="Buscar nesta categoria" autocomplete="off">
    </div>
    <div class="list-body">
      <div id="cat-list" class="cat-list scroll"></div>
      <div class="grid-wrap">
        <div id="grid" class="grid scroll"></div>
        <div id="list-loading" class="spinner center hidden"></div>
        <p id="list-msg" class="msg hidden"></p>
      </div>
    </div>
  </section>

  <!-- ===================== BUSCA ===================== -->
  <section id="screen-search" class="screen hidden">
    <div class="list-header">
      <button class="focusable back" data-back="1" aria-label="Voltar"></button>
      <h1>Buscar</h1>
      <input id="search-input" class="focusable input small wide" type="search" placeholder="Canal, filme ou série..." autocomplete="off">
    </div>
    <div id="search-tabs" class="search-tabs"></div>
    <div class="grid-wrap full">
      <div id="search-grid" class="grid scroll"></div>
      <div id="search-loading" class="spinner center hidden"></div>
      <p id="search-msg" class="msg">Digite pelo menos 2 letras para buscar.</p>
    </div>
  </section>

  <!-- ===================== EPISÓDIOS ===================== -->
  <section id="screen-episodes" class="screen hidden">
    <div class="list-header">
      <button class="focusable back" data-back="1" aria-label="Voltar"></button>
      <h1 id="ep-title"></h1>
    </div>
    <div id="ep-list" class="ep-list scroll"></div>
    <div id="ep-loading" class="spinner center hidden"></div>
    <p id="ep-msg" class="msg hidden"></p>
  </section>

  <!-- ===================== PLAYER ===================== -->
  <section id="screen-player" class="screen hidden">
    <video id="video" autoplay playsinline controls></video>
    <div id="player-loading" class="spinner center hidden"></div>
    <p id="player-error" class="player-error hidden"></p>
    <div id="osd" class="osd hidden">
      <button class="back light" data-back="1" aria-label="Voltar"></button>
      <div class="osd-text">
        <div id="osd-name" class="osd-name"></div>
        <div id="osd-epg" class="osd-epg"></div>
      </div>
      <div class="osd-actions">
        <button id="osd-prev" class="osd-btn" title="Canal anterior">▲</button>
        <button id="osd-next" class="osd-btn" title="Próximo canal">▼</button>
        <button id="osd-fav" class="osd-btn" title="Favoritar">☆</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <script src="js/app.js?v=b0a2a9b7"></script>
</body>
</html>
